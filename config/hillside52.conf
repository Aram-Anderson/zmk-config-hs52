# Encoders (Uncomment these two line to add support to your firmware)
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB Underglow (Uncomment these two lines to add support to your firmware)
# RGB quickly drains battery power
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Lower key detection latency while keeping release debounce conservative.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Improve BLE signal strength for both host and split links.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Reduce BLE connection latency for lower typing lag. This costs battery life.
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

# Use ZMK's built-in widget display instead of the nice!view custom screen.
# This removes the decorative right-side logo/art. The central half shows
# battery/output/layer status; the peripheral half shows battery/link status.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
